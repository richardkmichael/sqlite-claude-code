[project]
name = "sqlite-claude-code"
version = "0.1.0"
description = "SQLite extension for querying Claude Code conversation history"
readme = "README.md"
authors = [
    { name = "Richard Michael", email = "rmichael@edgeofthenet.org" }
]
requires-python = ">=3.10"
dependencies = []
license = "BSD-3-Clause"
keywords = ["sqlite", "claude-code", "extension"]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sqlite_claude_code"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
sqlite_claude_code = ["*.so", "*.dylib", "*.dll"]
